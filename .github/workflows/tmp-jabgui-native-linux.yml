name: TMP jabgui native (Linux)

on:
  push:
    branches: [ test/jabgui-native-linux-ci ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'true'

      - name: Install libraries needed to link static JavaFX
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxtst-dev libxxf86vm-dev libgl-dev

      - uses: ./.github/actions/setup-gradle

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build jabgui native binary
        run: gradle :jabgui:nativeCompile

      - name: Package
        run: tar -czf jabgui-native-linux-amd64.tar.gz -C jabgui/build/native nativeCompile

      - uses: actions/upload-artifact@v4
        with:
          name: jabgui-native-linux-amd64
          path: jabgui-native-linux-amd64.tar.gz
